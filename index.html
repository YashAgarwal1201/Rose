<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Canonical -->
    <link rel="canonical" href="https://projectt-rose.vercel.app/" />

    <!-- Favicon & PWA -->
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Viewport & Theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f43f5e" />

    <!-- Primary Meta -->
    <title>Rose — Notes, Docs, and Writing Workspace</title>
    <meta
      name="description"
      content="Rose is a writing and notes workspace for documents, rich text editing, tables, exports, and focused personal organization."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://projectt-rose.vercel.app/" />
    <meta
      property="og:title"
      content="Rose — Notes, Docs, and Writing Workspace"
    />
    <meta
      property="og:description"
      content="A writing and notes workspace with rich text editing, tables, and export tools."
    />
    <meta
      property="og:image"
      content="https://projectt-rose.vercel.app/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rose app preview" />
    <meta property="og:site_name" content="Rose" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://projectt-rose.vercel.app/" />
    <meta
      name="twitter:title"
      content="Rose — Notes, Docs, and Writing Workspace"
    />
    <meta
      name="twitter:description"
      content="A writing and notes workspace with rich text editing, tables, and export tools."
    />
    <meta
      name="twitter:image"
      content="https://projectt-rose.vercel.app/og-image.jpg"
    />

    <!-- PWA: iOS/Android standalone app support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Rose" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
